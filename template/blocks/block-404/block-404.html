<!-- start block-404 -->
<div block="block-404">
    <div class="grid"></div>
    <div elem="in" class="container">
        <div elem="number" class="js-number">

        </div>
        <div elem="col">
            <div elem="overtitle">/Ошибка 404/</div>
            <h1 elem="title">страница <br> не найдена</h1>
            <div elem="text">
                Похоже, страница, которую вы искали, была перемещена или больше не существует.
            </div>
            <div elem="buttons">
                <a block="site-button" mods="{{btnMods}}" aria-label="Назад" title="Назад">
                    {{ _icon('arr-l3', { tag: 'span' }) }} Назад
                </a>
                <a block="site-button" mods="{{btnMods}}" aria-label="На главную" title="На главную">
                    На главную {{ _icon('arr-r2', { tag: 'span' }) }}
                </a>
            </div>
        </div>
    </div>
</div>
<!-- end block-404 -->
