{% set sponsorData = sponsorData | default(sponsorRu) %}
<!-- start sponsor -->
<div block="sponsor">
    <div elem="title">{{ sponsorData.title }}</div>
    <div elem="text">
        {{ sponsorData.text | safe }}
    </div>
    <a elem="image" href="{{ sponsorData.link | default('#') }}" aria-label="{{ sponsorData.title }}">
        <img loading="lazy" src="{{ sponsorData.image }}" alt="">
    </a>
</div>
<!-- end sponsor -->
